<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Rafael Casino Night</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="Cartas.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050607;--red:#e0222a;--red-d:#8c0f15;--gold:#d9b25f;--gold-l:#f5e3a6;--gold-d:#8c6a2a;--ink:#f4efe3;--mute:#a9a291;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat',system-ui,sans-serif;
--goldt:linear-gradient(180deg,#fffaf0,var(--gold-l) 35%,var(--gold) 70%,var(--gold-d));
--goldb:linear-gradient(135deg,var(--gold-l),var(--gold) 30%,var(--gold-d) 60%,var(--gold-l))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;color:var(--ink);font-family:var(--sans);cursor:none;font-variant-numeric:lining-nums}
body{background:radial-gradient(ellipse 70% 55% at 50% -5%,rgba(224,34,42,.20),transparent 70%),radial-gradient(ellipse 80% 50% at 50% 115%,rgba(20,90,60,.30),transparent 70%),var(--bg)}
#dust{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
#dust i{position:absolute;bottom:-10px;width:.3vw;height:.3vw;border-radius:50%;background:var(--gold-l);opacity:0;animation:up linear infinite}
@keyframes up{0%{transform:translateY(0);opacity:0}15%{opacity:.6}85%{opacity:.3}100%{transform:translateY(-108vh) translateX(3vw);opacity:0}}
.screen{position:fixed;inset:0;opacity:0;visibility:hidden;transition:opacity 1.1s ease,visibility 1.1s;overflow:hidden}
.screen.on{opacity:1;visibility:visible}

/* ---------- espera ---------- */
#idle{display:flex;align-items:center;justify-content:center}
#idle .halo{position:absolute;width:60vh;height:60vh;border-radius:50%;background:radial-gradient(circle,rgba(224,34,42,.28),transparent 65%);animation:breathe 7s ease-in-out infinite}
#idle .logo{position:relative;height:50vh;max-width:70vw;object-fit:contain;filter:drop-shadow(0 0 2.5vw rgba(224,34,42,.4));animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.035);opacity:.92}}

/* ---------- cenário de casino (jogo + histórico) ---------- */
.stage{background:
 radial-gradient(ellipse 55% 60% at 50% 52%,rgba(224,34,42,.22),transparent 70%),
 radial-gradient(ellipse 90% 40% at 50% 112%,rgba(14,110,70,.38),transparent 70%),
 linear-gradient(180deg,#0a0405,#050607 40%,#04100b)}
.curtain{position:absolute;top:0;bottom:0;width:13vw;pointer-events:none;
 background:repeating-linear-gradient(90deg,#3d0407 0,#a8121b 1.1vw,#e0222a 1.5vw,#a8121b 1.9vw,#3d0407 3vw);
 -webkit-mask-image:linear-gradient(90deg,#000 20%,transparent);mask-image:linear-gradient(90deg,#000 20%,transparent);opacity:.75;animation:sway 9s ease-in-out infinite}
.curtain.l{left:0}
.curtain.r{right:0;transform:scaleX(-1);animation-name:sway2}
.curtain::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent 30%,transparent 70%,rgba(0,0,0,.8))}
@keyframes sway{50%{filter:brightness(1.18)}}
@keyframes sway2{50%{filter:brightness(1.18)}}
.cone{position:absolute;top:-4vh;left:50%;width:70vw;height:104vh;margin-left:-35vw;pointer-events:none;
 background:conic-gradient(from 180deg at 50% 0,transparent 0 163deg,rgba(255,226,160,.13) 172deg,rgba(255,240,200,.2) 180deg,rgba(255,226,160,.13) 188deg,transparent 197deg 360deg);filter:blur(.6vh);animation:cone 8s ease-in-out infinite}
@keyframes cone{50%{opacity:.6}}
.mq{position:absolute;pointer-events:none;
 background-image:radial-gradient(circle,#fff3c4 0 18%,var(--gold) 34%,rgba(217,178,95,0) 62%)}
.mq.t,.mq.b{left:3.6vw;right:3.6vw;height:1.6vh;background-size:2.4vw 100%;background-repeat:repeat-x}
.mq.l,.mq.r{top:3.4vh;bottom:3.4vh;width:1.6vh;background-size:100% 2.4vw;background-repeat:repeat-y}
.mq.t{top:2.2vh}.mq.b{bottom:2.2vh}.mq.l{left:1.8vw}.mq.r{right:1.8vw}
.mq.x{background-position:0 0;animation:bulbA 1.6s steps(1) infinite}
.mq.y{animation:bulbB 1.6s steps(1) infinite}
.mq.t.y,.mq.b.y{background-position:1.2vw 0}.mq.l.y,.mq.r.y{background-position:0 1.2vw}
@keyframes bulbA{0%{opacity:1}50%{opacity:.18}}
@keyframes bulbB{0%{opacity:.18}50%{opacity:1}}
.rim{position:absolute;inset:4.6vh 3.4vw;border:1px solid rgba(217,178,95,.4);pointer-events:none}
.rim::after{content:"";position:absolute;inset:.8vh .5vw;border:1px solid rgba(217,178,95,.15)}
.orn{position:absolute;color:var(--gold);font-size:2vw;line-height:1;z-index:3;text-shadow:0 0 1.5vh rgba(217,178,95,.6)}
.orn.a{top:6.2vh;left:5vw}.orn.b{top:6.2vh;right:5vw}.orn.c{bottom:6.2vh;left:5vw}.orn.d{bottom:6.2vh;right:5vw}
.orn.b,.orn.d{color:var(--red);text-shadow:0 0 1.5vh rgba(224,34,42,.7)}

.col{position:absolute;inset:6.6vh 9vw 6.6vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:0;z-index:3}
#game .mid{flex:1 1 0;min-height:0;padding:2vh 0 3vh;width:100%;display:flex;align-items:center;justify-content:center}
#history .mid{flex:none;height:66vh;width:100%;display:flex;align-items:center;justify-content:center}
.brand{flex:none;display:flex;justify-content:center;align-items:center}
.brand img{height:11vh;max-width:40vw;object-fit:contain;filter:drop-shadow(0 0 2vh rgba(224,34,42,.55))}

/* medalhão central */
#ring{position:relative;height:min(50vh,100%);aspect-ratio:1/1;flex:none;display:flex;align-items:center;justify-content:center;animation:float2 7s ease-in-out infinite}
@keyframes float2{50%{transform:translateY(-.9vh)}}
#ring .gold{position:absolute;inset:0;border-radius:50%;
 background:conic-gradient(from 0deg,#8c6a2a,#f5e3a6,#d9b25f,#8c6a2a,#f5e3a6,#d9b25f,#8c6a2a,#f5e3a6,#d9b25f,#8c6a2a);
 box-shadow:0 0 10vh rgba(224,34,42,.45),0 0 3.5vh rgba(217,178,95,.4),0 3.5vh 7vh rgba(0,0,0,.8);animation:spin 28s linear infinite}
#ring .ticks{position:absolute;inset:1.1vh;border-radius:50%;background:repeating-conic-gradient(#2a1c07 0 1.2deg,transparent 1.2deg 6deg);
 -webkit-mask-image:radial-gradient(circle,transparent 93.5%,#000 94%,#000 99%,transparent 99.5%);mask-image:radial-gradient(circle,transparent 93.5%,#000 94%,#000 99%,transparent 99.5%);animation:spin 28s linear infinite reverse}
#ring .face{position:absolute;inset:2.6vh;border-radius:50%;
 background:radial-gradient(circle at 34% 22%,#ff6a70 0,var(--red) 20%,#ae131a 52%,#58080c 88%,#2c0306 100%);
 box-shadow:inset 0 0 0 .5vh rgba(245,227,166,.9),inset 0 0 0 1.2vh rgba(110,8,13,.95),inset 0 0 0 1.45vh rgba(217,178,95,.5),inset 0 -5vh 9vh rgba(0,0,0,.5),inset 0 3.5vh 7vh rgba(255,170,170,.16)}
#ring .sheen{position:absolute;inset:2.6vh;border-radius:50%;overflow:hidden}
#ring .sheen::before{content:"";position:absolute;top:-20%;bottom:-20%;width:26%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-14deg);animation:sweep 6s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-40%}100%{left:130%}}
@keyframes spin{to{transform:rotate(360deg)}}
#num{position:relative;z-index:2;font-family:var(--serif);font-weight:700;font-size:30vh;line-height:1;letter-spacing:-.01em;
 background:linear-gradient(180deg,#fffdf6 0%,var(--gold-l) 42%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 .7vh .5vh rgba(50,0,0,.7)) drop-shadow(0 0 2.2vh rgba(255,220,150,.3))}
#num.in{animation:numin 1.2s cubic-bezier(.2,.9,.2,1)}
@keyframes numin{0%{opacity:0;transform:scale(.55) rotate(-8deg);filter:blur(1.8vh)}60%{transform:scale(1.07)}100%{opacity:1;transform:none}}
#wait{position:relative;z-index:2;font-family:var(--serif);font-style:italic;font-weight:300;font-size:3.6vw;color:var(--gold-l);text-shadow:0 .4vh 1.2vh rgba(0,0,0,.7)}
#burst{position:absolute;inset:0;border-radius:50%;border:.5vh solid var(--gold-l);opacity:0;pointer-events:none;z-index:2}
#burst.go{animation:burst 1.4s ease-out}
@keyframes burst{0%{opacity:.9;transform:scale(1);box-shadow:0 0 4vh var(--gold)}100%{opacity:0;transform:scale(1.2);box-shadow:0 0 12vh transparent}}

/* placas laterais */
.plaque{position:absolute;top:53%;width:15vw;margin-top:-10vh;height:20vh;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;
 background:linear-gradient(180deg,rgba(20,8,9,.85),rgba(6,6,6,.9));border:1px solid rgba(217,178,95,.55);box-shadow:0 0 4vh rgba(0,0,0,.6),inset 0 0 3vh rgba(217,178,95,.08)}
.plaque::before{content:"";position:absolute;inset:.7vh;border:1px solid rgba(217,178,95,.2);pointer-events:none}
.plaque.l{left:11vw}.plaque.r{right:11vw}
.plaque small{font-size:.75vw;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);padding-left:.5em}
.plaque b{font-family:var(--serif);font-weight:600;font-size:9vh;line-height:1.05;margin-top:.8vh;background:var(--goldt);-webkit-background-clip:text;background-clip:text;color:transparent}
.plaque.r b{background:linear-gradient(180deg,#fff,var(--ink) 40%,var(--mute));-webkit-background-clip:text;background-clip:text}

/* últimas bolas */
#rail{flex:none;position:relative;z-index:5;display:flex;flex-direction:column;align-items:center}
#rail .lab{font-size:.78vw;letter-spacing:.6em;text-transform:uppercase;color:var(--gold);padding-left:.6em;margin-bottom:1.6vh;display:flex;align-items:center;gap:1.2vw}
#rail .lab::before,#rail .lab::after{content:"";width:6vw;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
#rail .lab::after{transform:scaleX(-1)}
#prev{display:flex;gap:2.2vw;align-items:center;min-height:10vh}
.chip{width:10vh;height:10vh;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;font-family:var(--serif);font-weight:700;font-size:4.8vh;color:var(--gold-l);
 background:radial-gradient(circle at 34% 24%,#ff6a70,var(--red) 28%,#8c0f15 80%,#3a0509);
 box-shadow:0 0 0 .4vh var(--gold),0 0 0 .8vh rgba(5,6,7,.95),0 0 0 .95vh rgba(217,178,95,.4),0 1.2vh 3vh rgba(0,0,0,.7);text-shadow:0 .3vh .6vh rgba(0,0,0,.7)}
.chip::before{content:"";position:absolute;inset:.5vh;border-radius:50%;background:repeating-conic-gradient(rgba(245,227,166,.9) 0 8deg,transparent 8deg 30deg);
 -webkit-mask-image:radial-gradient(circle,transparent 82%,#000 84%);mask-image:radial-gradient(circle,transparent 82%,#000 84%)}
.chip::after{content:"";position:absolute;inset:1.3vh;border-radius:50%;border:1px solid rgba(245,227,166,.4)}
.chip:nth-child(2){filter:brightness(.85)}.chip:nth-child(3){filter:brightness(.7)}.chip:nth-child(4){filter:brightness(.55)}.chip:nth-child(5){filter:brightness(.4)}

#game .col{display:grid;grid-template-columns:24vw 1fr;grid-template-rows:auto minmax(0,1fr);align-items:center;justify-items:center;column-gap:2vw}
#game .brand{grid-column:1/-1;grid-row:1}
#game #rail{grid-column:1;grid-row:2}
#game .mid{grid-column:2;grid-row:2;height:100%;min-height:0}
#game #prev{flex-direction:column;gap:1.8vh}
#game .chip{width:9vh;height:9vh;font-size:4.2vh}
#game #rail .lab{margin-bottom:2.2vh}
/* ---------- histórico ---------- */
#history .title{flex:none;text-align:center;display:flex;align-items:center;justify-content:center;gap:1.6vw;font-family:var(--serif);font-size:1.7vw;letter-spacing:.55em;text-transform:uppercase;color:var(--gold-l)}
#history .title::before,#history .title::after{content:"";width:10vw;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
#history .title::after{transform:scaleX(-1)}
#grid{height:66vh;width:73.3vh;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(9,1fr);gap:1vh .5vw}
#grid div{display:flex;align-items:center;justify-content:center;border-radius:50%;font-family:var(--serif);font-weight:600;font-size:3.4vh;color:rgba(244,239,227,.18);border:1px solid rgba(217,178,95,.14);min-width:0;min-height:0}
#grid div.hit{color:var(--gold-l);border-color:var(--gold);background:radial-gradient(circle at 34% 26%,#ff6a70,var(--red) 35%,#7d0d13);box-shadow:0 0 1.8vh rgba(224,34,42,.45),inset 0 0 0 .3vh rgba(5,6,7,.55)}
#grid div.now{background:var(--goldb);color:#2a1a04;border-color:#fff;box-shadow:0 0 3.5vh rgba(245,227,166,.8);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{transform:scale(1.08)}}
#snd{position:fixed;right:1.5vw;bottom:1.2vh;font-size:.8vw;letter-spacing:.3em;color:var(--mute);opacity:.7;display:none;text-transform:uppercase;z-index:9}
</style>
</head>
<body>
<div id="dust"></div>

<div class="screen on" id="idle">
  <div class="halo"></div>
  <img class="logo" src="Logo do Evento.png" alt="Rafael Casino Night">
</div>

<div class="screen stage" id="game">
  <div class="curtain l"></div><div class="curtain r"></div><div class="cone"></div>
  <div class="mq t x"></div><div class="mq t y"></div><div class="mq b x"></div><div class="mq b y"></div>
  <div class="mq l x"></div><div class="mq l y"></div><div class="mq r x"></div><div class="mq r y"></div>
  <div class="rim"></div>
  <span class="orn a">♠</span><span class="orn b">♥</span><span class="orn c">♣</span><span class="orn d">♦</span>
  <div class="col">
  <div class="brand"><img src="Logo do Evento.png" alt=""></div>
  <div class="mid">
  <div id="ring">
    <div id="burst"></div>
    <div class="gold"></div><div class="ticks"></div><div class="face"></div><div class="sheen"></div>
    <div id="num">–</div><div id="wait">Boa sorte</div>
  </div>
  </div>
  <div id="rail"><div class="lab">Últimas bolas</div><div id="prev"></div></div>
  </div>
</div>

<div class="screen stage" id="history">
  <div class="curtain l"></div><div class="curtain r"></div><div class="cone"></div>
  <div class="mq t x"></div><div class="mq t y"></div><div class="mq b x"></div><div class="mq b y"></div>
  <div class="mq l x"></div><div class="mq l y"></div><div class="mq r x"></div><div class="mq r y"></div>
  <div class="rim"></div>
  <span class="orn a">♠</span><span class="orn b">♥</span><span class="orn c">♣</span><span class="orn d">♦</span>
  <div class="col">
  <div class="brand"><img src="Logo do Evento.png" alt=""></div>
  <div class="title">Bolas que já saíram</div>
  <div class="mid"><div id="grid"></div></div>
  </div>
</div>
<div id="snd">Clique para ativar o som</div>

<script>
const KEY='bingo_state',CH='bingo_channel',$=id=>document.getElementById(id);
for(let i=0;i<30;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'vw';e.style.animationDuration=(16+Math.random()*18)+'s';e.style.animationDelay=(-Math.random()*30)+'s';$('dust').appendChild(e)}
for(let i=1;i<=90;i++){const d=document.createElement('div');d.id='g'+i;d.textContent=i;$('grid').appendChild(d)}

/* ---- som suave ---- */
let actx;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return actx}
function chime(vol){
  const c=ac();if(!c||c.state!=='running')return;
  const t=c.currentTime,out=c.createGain(),lp=c.createBiquadFilter();
  lp.type='lowpass';lp.frequency.value=1800;out.connect(lp);lp.connect(c.destination);
  const peak=Math.max(.01,vol)*.35;
  out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(peak,t+.12);out.gain.exponentialRampToValueAtTime(.0008,t+2.6);
  [[523.25,0],[783.99,.18]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.value=d?.6:1;o.connect(g);g.connect(out);o.start(t+d);o.stop(t+2.7)});
}
/* ---- voz (ficheiros mp3 pre-gerados em audio/) ---- */
const clips={};
function clip(n){if(!clips[n]){const a=new Audio('audio/'+n+'.mp3');a.preload='auto';clips[n]=a}return clips[n]}
function preload(){for(let i=1;i<=90;i++)clip(i).load()}
let cur_audio=null;
function say(n){
  try{if(cur_audio){cur_audio.pause();cur_audio.currentTime=0}}catch(e){}
  const a=clip(n);cur_audio=a;a.currentTime=0;a.volume=1;a.play().catch(()=>{});
}
function hint(st){const need=st&&((st.sound&&st.soundTv)||st.voice)&&(!actx||actx.state!=='running');$('snd').style.display=need?'block':'none'}
function fs(){const d=document.documentElement;d.requestFullscreen&&!document.fullscreenElement&&d.requestFullscreen().catch(()=>{})}
document.addEventListener('click',()=>{preload();const c=ac();c&&c.resume().then(()=>hint(cur_st));fs()});
document.addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')fs()});

/* ---- estado ---- */
let cur_st=null,lastSeq=null;
function render(st){
  st=st||{phase:'idle',drawn:[]};cur_st=st;
  const drawn=st.drawn||[],cur=drawn[drawn.length-1];
  hint(st);
  ['idle','game','history'].forEach(x=>$(x).classList.remove('on'));
  if(st.phase!=='playing'){$('idle').classList.add('on');return}
  if(st.history){
    for(let i=1;i<=90;i++)$('g'+i).className='';
    drawn.forEach(n=>$('g'+n).className='hit');
    if(cur)$('g'+cur).className='now';
    $('history').classList.add('on');return;
  }
  $('game').classList.add('on');
  $('num').style.display=cur?'block':'none';$('wait').style.display=cur?'none':'block';
  const p=$('prev');p.innerHTML='';drawn.slice(-6,-1).reverse().forEach(n=>{const s=document.createElement('div');s.className='chip';s.textContent=n;p.appendChild(s)});
  $('rail').style.visibility=drawn.length>1?'visible':'hidden';
  if(cur&&$('num').textContent!=cur){
    $('num').textContent=cur;$('num').classList.remove('in');void $('num').offsetWidth;$('num').classList.add('in');
    $('burst').classList.remove('go');void $('burst').offsetWidth;$('burst').classList.add('go');
  }else if(cur)$('num').textContent=cur;
  if(st.lastEvent==='draw'&&st.seq!==lastSeq&&lastSeq!==null){
    if(st.sound&&st.soundTv)chime(st.volume??.5);
    if(st.voice)setTimeout(()=>say(cur),st.sound&&st.soundTv?700:0);
  }
  lastSeq=st.seq??0;
}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
window.addEventListener('storage',e=>{if(e.key===KEY)render(load())});
try{new BroadcastChannel(CH).onmessage=e=>{const d=e.data;if(d&&d.test){if(d.test==='chime')chime(d.volume??.5);if(d.test==='voice')say(d.n||47);return}render(d)}}catch(e){}
const init=load();lastSeq=init?(init.seq??0):0;render(init);
</script>
</body>
</html>
