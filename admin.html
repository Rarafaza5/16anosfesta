<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · Rafael Casino Night</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="frame"><div class="card">
    <div class="center"><img src="Logo do evento.png" alt="" style="width:240px;margin:-50px 0 -50px"></div><br><br>
    <p class="eyebrow center">Painel do Anfitrião</p>

    <section id="panel">
      <div class="stats">
        <div class="stat"><b id="nTot">0</b><small>Respostas</small></div>
        <div class="stat"><b id="nYes">0</b><small>Confirmados</small></div>
        <div class="stat r"><b id="nNo">0</b><small>Ausentes</small></div>
      </div>
      <div class="tabs">
        <button class="tab on" data-f="all">Todos</button>
        <button class="tab" data-f="sim">♠ Vão</button>
        <button class="tab" data-f="nao">♦ Não vão</button>
        <button class="tab" id="csv">Exportar CSV</button>
      </div>
      <div id="list"></div>
    </section>
  </div></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyCA2uFUGcJy1BT7l6K_iJOAJLAvpKhdgxQ",
  authDomain: "rafael-diogo.firebaseapp.com",
  databaseURL: "https://rafael-diogo-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "rafael-diogo",
  storageBucket: "rafael-diogo.firebasestorage.app",
  messagingSenderId: "393645739677",
  appId: "1:393645739677:web:5ebbdc7232d991206f0e74",
  measurementId: "G-ZXWLFQQCZJ"
});
const db=firebase.database();
const $=s=>document.querySelector(s);
let data=[], filter='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

db.ref('convidados').orderByChild('ts').on('value',s=>{data=[];s.forEach(c=>{data.push(c.val())});data.reverse();render()},
  e=>{$('#list').innerHTML='<div class="empty">Sem permissão para ler. Verifique as regras da base de dados.</div>'});

document.querySelectorAll('.tab[data-f]').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab[data-f]').forEach(x=>x.classList.remove('on'));t.classList.add('on');filter=t.dataset.f;render();
});

function render(){
  const y=data.filter(d=>d.vem==='sim').length, n=data.filter(d=>d.vem==='nao').length;
  $('#nTot').textContent=data.length;$('#nYes').textContent=y;$('#nNo').textContent=n;
  const l=data.filter(d=>filter==='all'||d.vem===filter);
  $('#list').innerHTML=l.length?l.map(d=>`
    <div class="guest">
      <div class="badge ${d.vem==='sim'?'yes':'no'}">${d.vem==='sim'?'♠':'♦'}</div>
      <div><h3>${esc(d.nome)}</h3>${d.nota?`<p>“${esc(d.nota)}”</p>`:''}</div>
      <time>${d.ts?new Date(d.ts).toLocaleString('pt-PT',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):''}</time>
    </div>`).join(''):'<div class="empty">Ainda não há respostas.</div>';
}

$('#csv').onclick=()=>{
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Nome','Vem','Observação','Data'],...data.map(d=>[d.nome,d.vem,d.nota,d.ts?new Date(d.ts).toISOString():''])];
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));
  a.download='convidados.csv';a.click();
};
</script>
</body>
</html>
